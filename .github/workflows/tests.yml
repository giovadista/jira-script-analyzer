name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate sample HTML report
        run: python analyzer.py examples --format html --output report.html
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser analyzer engine
        run: npm test
      - name: Check browser application syntax
        run: |
          node --check docs/engine.js
          node --check docs/app.js
